# Secret resources served by KBS to attested workloads. Sourced from Vault.
# kbsSecretResources in the KbsConfig references the resulting "kbsres1" secret;
# each key becomes a KBS resource at default/kbsres1/<key>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbsres1
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.kbsResources.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: kbsres1
    template:
      type: Opaque
      data:
        {{- range .Values.kbsResources.fields }}
        {{ . }}: "{{ printf "{{ .%s }}" (regexReplaceAll "-" . "_") }}"
        {{- end }}
  data:
    {{- range .Values.kbsResources.fields }}
    - secretKey: {{ regexReplaceAll "-" . "_" }}
      remoteRef:
        key: {{ $.Values.kbsResources.key }}
        property: {{ . }}
    {{- end }}
---
# KBS admin auth public key, consumed by the KbsConfig (kbsAuthSecretName).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-auth-public-key
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.authKey.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: kbs-auth-public-key
    template:
      type: Opaque
      data:
        kbs.pem: "{{ `{{ .kbs_pem }}` }}"
  data:
    - secretKey: kbs_pem
      remoteRef:
        key: {{ .Values.authKey.key }}
        property: {{ .Values.authKey.property }}
